<div class="auth-screen">
  <div class="side-panel" aria-hidden="true"></div>

  <div class="form-panel">
    <div class="form-wrap">
      <div class="brand">
        <app-logo [size]="56" />
        <div>
          <div class="brand-name">Soportix</div>
          <div class="brand-subtitle">Mesa de ayuda</div>
        </div>
      </div>

      <h1>Inicia sesión</h1>
      <p class="subtitle">Ingresa con tu cuenta corporativa para continuar.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <label class="field-label" for="login-username">Usuario</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <input
            matInput
            id="login-username"
            formControlName="username"
            placeholder="Ingresa tu usuario"
            [errorStateMatcher]="matcher"
          />
        </mat-form-field>

        <label class="field-label" for="login-password">Contraseña</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <input
            matInput
            id="login-password"
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            [errorStateMatcher]="matcher"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            [attr.aria-label]="hidePassword() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          >
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="options-row">
          <mat-checkbox formControlName="remember">Recordarme</mat-checkbox>
          <button type="button" class="link-btn" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</button>
        </div>

        @if (error) {
          <p class="error-message">{{ error }}</p>
        }

        <button mat-flat-button type="submit" class="submit-btn full-width" [disabled]="loginForm.invalid">
          Acceder
        </button>
      </form>

      <p class="bottom-link">¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a></p>
    </div>
  </div>
</div>
