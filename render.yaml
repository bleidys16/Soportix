services:
  # Backend - Django API
  - type: web
    name: soportix-backend
    runtime: python
    rootDir: helpdesk-backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://soportix-frontend.onrender.com"
      - key: RENDER_EXTERNAL_HOSTNAME
        value: "soportix-backend.onrender.com"
      # Conexión a la base de datos PostgreSQL de Neon
      - key: DATABASE_URL
        sync: false
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        value: "neondb_owner"
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: "ep-plain-star-athckzxe-pooler.c-9.us-east-1.aws.neon.tech"
      - key: DB_PORT
        value: "5432"

  # Frontend - Angular SPA (Static Site)
  - type: static
    name: soportix-frontend
    rootDir: helpdesk-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/helpdesk-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"